title: YMZ Blog
description: 医学图像、工程实践、写作复盘与视觉观察的长期记录。
lang: zh-CN
timezone: Asia/Shanghai
future: true
markdown: kramdown
kramdown:
  input: GFM
permalink: /posts/:title/
collections:
  projects:
    output: true
    permalink: /projects/:name/
  photography:
    output: true
    permalink: /photography/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      page_id: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      page_id: project
  - scope:
      path: ""
      type: photography
    values:
      layout: photo
      page_id: photo
author:
  name: YMZ
  role: 医学图像 / 工程 / 摄影
  bio: 以医学图像和工程实践为主线，持续记录实验过程、工具链经验、项目复盘和视觉观察。
  location: China
  github: https://github.com/YMZ1998
  intro: 这里不是一次性的展示页，而是一个长期维护的工作台：记录问题、方法、取舍和结果。
focus_areas:
  - title: CBCT 与 pseudo CT
    description: 关注数据处理、模型训练、图像重建、结果验证和实验复盘。
  - title: 工程结构与工具链
    description: 沉淀项目结构、脚本自动化、部署流程和可复用的工程约定。
  - title: 摄影与记录
    description: 用图像记录场景、构图、光线和视觉表达上的观察。
