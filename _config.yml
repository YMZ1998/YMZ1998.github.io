title: YMZ Blog
description: 记录医学图像研究、工程实践与摄影观察的个人博客。
lang: zh-CN
timezone: Asia/Shanghai
future: true
markdown: kramdown
kramdown:
  input: GFM
permalink: /posts/:title/
collections:
  projects:
    output: true
    permalink: /projects/:name/
  photography:
    output: true
    permalink: /photography/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      page_id: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      page_id: project
  - scope:
      path: ""
      type: photography
    values:
      layout: photo
      page_id: photo
author:
  name: YMZ
  role: 医学图像 / 工程 / 摄影
  bio: 记录医学图像研究、工程实现、工具链经验和长期学习笔记。
  location: China
  github: https://github.com/YMZ1998
  intro: 我把研究过程、工程实践和阅读整理成可复盘的文章，也保留一些摄影观察。
focus_areas:
  - title: CBCT 与 pseudo CT
    description: 记录数据处理、模型训练、重建实验和结果复盘。
  - title: 工程结构与工具链
    description: 整理项目结构、脚本自动化、部署流程和工具使用经验。
  - title: 摄影与记录
    description: 保存照片、场景观察和与视觉表达有关的思考。
